<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Performance Analyzer</h1>
        <p class="subtitle">Calculate Total Marks, Percentage and Grade</p>

        <div class="form-section">

            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">

            <label for="maths">Mathematics</label>
            <input type="number" id="maths" placeholder="Enter marks" min="0" max="100">

            <label for="science">Science</label>
            <input type="number" id="science" placeholder="Enter marks" min="0" max="100">

            <label for="english">English</label>
            <input type="number" id="english" placeholder="Enter marks" min="0" max="100">

            <label for="physics">Physics</label>
            <input type="number" id="physics" placeholder="Enter marks" min="0" max="100">

            <label for="chemistry">Chemistry</label>
            <input type="number" id="chemistry" placeholder="Enter marks" min="0" max="100">

            <div class="button-group">
    <button onclick="calculateResult()">Calculate Result</button>
    <button class="reset-btn" onclick="resetForm()">Reset</button>
</div>

        </div>

        <div id="result" class="result-section">

            <h2>Result</h2>

            <p>Student: <span id="resultName">-</span></p>
            <p>Total Marks: <span id="totalMarks">-</span> / 500</p>
            <p>Percentage: <span id="percentage">-</span>%</p>
            <p>Grade: <span id="grade">-</span></p>
            <p>Result: <span id="passFail">-</span></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
